name: Secret Scan

# L2 兜底：在每次 push / PR 扫描密钥，防止 TAURI_APP_*/TAURI_LINK_*/签名私钥等被误提交。
# 与 books 同款口径（框架统一）。
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全量历史扫描
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          # 默认扫描全仓库；如误报多，可放 .gitleaks.toml 用 allowlist 收敛

# 多平台自动打包 + 发布 Release + 生成在线更新清单（latest.json）
#
# 触发方式：
#   1) 推送形如 v1.0.0 的 tag（发版主用；版本号取自 src-tauri/tauri.conf.json 的 version）
#   2) 手动触发（Actions → Release → Run workflow）
#
# 关键设计：
#   - 更新签名使用 Tauri 自带的 minisign 密钥对，与苹果证书完全无关；
#     私钥只存在于仓库 Secrets：TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   - tauri-action 会把各平台安装包与其 .sig 签名一并上传到 Release，
#     并额外生成 latest.json —— 应用内 updater 的 endpoint 正是指向
#     https://github.com/trexwb/Edtib-Console/releases/latest/download/latest.json
#   - macOS 不使用 Apple Developer 证书：走 tauri.macos.conf.json 中的 ad-hoc 签名
#     （signingIdentity: "-"），因此 CI 无需任何 Apple 相关 Secrets
#   - 打包目标由平台覆盖配置决定：macOS → app/dmg，Windows → nsis

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      # tauri-action 需要创建/更新 Release 与上传 Assets
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon（M 系列）
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest # Intel Mac
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # 两个 macOS 目标只在 macos runner 上需要
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # tauri-action 自动替换为 tauri.conf.json 中的 version
          releaseName: 'EDTIB控制中台 v__VERSION__'
          releaseBody: '安装包与在线更新清单（latest.json）见下方 Assets。'
          releaseDraft: false # 必须为非草稿，endpoint 的 releases/latest 才能命中
          prerelease: false
          includeUpdaterJson: true # 生成 latest.json（含各平台 url + signature）
          args: ${{ matrix.args }}
